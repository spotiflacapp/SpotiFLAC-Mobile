name: spotiflac_android
description: Extension-driven music metadata and downloads for mobile devices
publish_to: "none"
version: 5.0.8+157

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  timezone: ^0.11.1

  # State Management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.0.0

# Storage & Persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.3

# HTTP & Network
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7

  # Streaming backup archives
  archive: ^4.2.0

  # UI Components
  cached_network_image: ^4.0.2
  flutter_cache_manager: ^3.4.5
  liquid_glass_easy: ^4.3.2
  cupertino_icons: ^1.0.9
  volume_controller: ^3.7.1

  # Material Expressive 3 / Dynamic Color
  dynamic_color: ^2.1.0
  material_ui: ^1.4.0
  material_3_expressive: ^1.1.3

  # Permissions
  permission_handler: ^13.0.1

  # File Picker
  file_picker: ^13.1.0

  # JSON Serialization
  json_annotation: ^4.12.0

  # Utils
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  receive_sharing_intent: ^1.9.0
  logger: ^2.7.0

  # FFmpeg for audio conversion
  ffmpeg_kit_flutter_new_full: ^2.5.2
  open_filex: ^4.7.0

  video_player: ^2.14.0

  xml: ^7.0.1
  html: ^0.15.7

  # Notifications
  flutter_local_notifications: ^22.3.0
  audioplayers: ^6.8.1
  audio_service:
    path: third_party/audio_service
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^14.4.0
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_lint: ^3.1.9
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  video_player_platform_interface: 6.9.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "icon_foreground_android.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "icon_foreground_android.png"
  ios_content_mode: scaleAspectFill
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/Inter-LICENSE.txt
    - assets/licenses/usb.txt
    - assets/licenses/oboe.txt
    - assets/licenses/wavpack.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
